[project]
name = "english-api"
version = "0.1.0"
description = "英语学习软件后端 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "edge-tts>=6.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
