<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读后台管理</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --line: #e6e9f2; --text: #1f2d50;
    --muted: #8a94ad; --accent: #4f7cff; --danger: #fa5151; --ok: #07c160;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 0 24px;
    display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 14px 0; font-weight: 700; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 14px 18px; cursor: pointer; color: var(--muted); font-weight: 600;
    border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 1000px; margin: 24px auto; padding: 0 20px 80px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 3px rgba(31,45,80,.06); margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], input[type=number], textarea, select {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit;
    color: var(--text); width: 100%; }
  textarea { resize: vertical; min-height: 120px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { font-size: 13px; color: var(--muted); }
  button { border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); border-color: #f3c1c1; }
  button.small { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .muted { color: var(--muted); }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .grow { flex: 1; min-width: 0; }
  .tag { display: inline-block; font-size: 12px; color: var(--accent); background: #eef2fb;
    padding: 2px 8px; border-radius: 6px; margin-right: 4px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; margin-bottom: 4px; }
  .checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkbox-list label { display: flex; align-items: center; gap: 4px; color: var(--text);
    border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .quiz { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .opt { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt input[type=text] { flex: 1; }
  .opt .correct { flex-shrink: 0; }
  .gloss-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .gloss-row .w { width: 180px; flex-shrink: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .gloss-row input { flex: 1; }
  .stats { display: flex; gap: 20px; margin-bottom: 10px; }
  .stats .k { color: var(--muted); font-size: 12px; }
  .stats .v { font-size: 16px; font-weight: 700; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f2d50; color: #fff; padding: 10px 20px; border-radius: 8px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
</style>
</head>
<body>
<header>
  <h1>阅读后台管理</h1>
  <nav class="tabs">
    <div class="tab active" id="tab-topics" onclick="switchTab('topics')">主题管理</div>
    <div class="tab" id="tab-articles" onclick="switchTab('articles')">文章管理</div>
    <div class="tab" id="tab-ai" onclick="switchTab('ai')">AI 提供者</div>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const main = () => $("main");

const state = {
  tab: "topics",
  topics: [],
  articles: [],
  editing: null,        // null=列表, 'new'=新增, id=编辑
  form: null,           // 正在编辑的文章对象
  analyze: null,        // 定级/生词预览结果
  aiLoading: false,     // AI 生成本文义进行中
  ai: { providers: [], default: null, editing: null },
};

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function maskKey(k) {
  if (!k) return "";
  if (k.length <= 8) return "****";
  return k.slice(0, 4) + "****" + k.slice(-4);
}

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = "toast"), 2600);
}

async function api(path, method, body) {
  const res = await fetch("/api" + path, {
    method: method || "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

// ---------- 主题 ----------

async function loadTopics() {
  state.topics = (await api("/topics")).items;
}
async function addTopic() {
  const key = $("new-topic-key").value.trim();
  const label = $("new-topic-label").value.trim();
  if (!key || !label) return toast("key 与中文名均不能为空", true);
  try { await api("/topics", "POST", { key, label_zh: label }); } catch (e) { return toast(e.message, true); }
  $("new-topic-key").value = ""; $("new-topic-label").value = "";
  await renderTopics();
  toast("已添加主题");
}
async function delTopic(key, label) {
  if (!confirm(`确认删除主题「${label}」？`)) return;
  try { await api("/topics/" + key, "DELETE"); } catch (e) { return toast(e.message, true); }
  await renderTopics();
  toast("已删除主题");
}

// ---------- 文章 ----------

function newForm() {
  return { title: "", subtitle: "", body: "", topics: [], target_level: null,
    glosses: {}, full_glosses: {}, headwords: {}, multiword: [], skip: [], quizzes: [] };
}
function newOption() { return { text: "", correct: false }; }
function newQuiz() {
  return { type: "choice", question: "", options: [newOption(), newOption(), newOption(), newOption()],
    explanation_zh: "", explanation_en: "" };
}

async function loadArticles() {
  state.articles = (await api("/articles")).items;
}
async function startCreate() {
  state.editing = "new";
  state.form = newForm();
  state.analyze = null;
  renderArticles();
}
async function startEdit(id) {
  const a = await api("/articles/" + id);
  state.editing = id;
  state.form = { title: a.title, subtitle: a.subtitle || "", body: a.body, topics: a.topics || [],
    target_level: a.target_level, glosses: a.glosses || {}, full_glosses: a.full_glosses || {},
    headwords: a.headwords || {},
    multiword: Object.entries(a.terms || {}).map(([text, gloss]) => ({ text, gloss, kind: "term" })),
    skip: a.skip || [],
    quizzes: a.quizzes || [] };
  state.analyze = null;
  renderArticles();
}
async function delArticle(id, title) {
  if (!confirm(`确认删除文章「${title}」？`)) return;
  try { await api("/articles/" + id, "DELETE"); } catch (e) { return toast(e.message, true); }
  await renderArticles();
  toast("已删除文章");
}
function cancelEdit() { state.editing = null; renderArticles(); }

// 表单字段
function setField(k, v) { state.form[k] = v; }
function toggleTopic(key, checked) {
  const t = state.form.topics;
  const i = t.indexOf(key);
  if (checked && i < 0) t.push(key);
  if (!checked && i >= 0) t.splice(i, 1);
}
function addQuiz() { state.form.quizzes.push(newQuiz()); renderForm(); }
function delQuiz(qi) { state.form.quizzes.splice(qi, 1); renderForm(); }
function setQuiz(qi, k, v) { state.form.quizzes[qi][k] = v; }
function addOption(qi) { state.form.quizzes[qi].options.push(newOption()); renderForm(); }
function delOption(qi, oi) { state.form.quizzes[qi].options.splice(oi, 1); renderForm(); }
function setOption(qi, oi, k, v) { state.form.quizzes[qi].options[oi][k] = v; }
function setGloss(lemma, v) { state.form.glosses[lemma] = v; }
function setMwGloss(i, v) { state.form.multiword[i].gloss = v; }
function setMwKind(i, kind) { state.form.multiword[i].kind = kind; renderForm(); }
function delMw(i) { state.form.multiword.splice(i, 1); renderForm(); }
function delGloss(lemma) {
  delete state.form.glosses[lemma];
  if (!state.form.skip.includes(lemma)) state.form.skip.push(lemma);
  if (state.analyze) state.analyze.vocabulary = state.analyze.vocabulary.filter((v) => v.lemma !== lemma);
  renderForm();
}

async function analyzeBody() {
  const body = state.form.body;
  if (!body.trim()) return toast("请先填写正文", true);
  try {
    const r = await api("/articles/analyze", "POST", { body });
    state.analyze = r;
    state.form.target_level = r.level;
    const skipSet = new Set(state.form.skip || []);
    const g = {};
    r.vocabulary.forEach((v) => { if (!skipSet.has(v.lemma)) g[v.lemma] = v.gloss; });
    state.form.glosses = g;
    state.analyze.vocabulary = r.vocabulary.filter((v) => !skipSet.has(v.lemma));
    state.form.multiword = r.multiword || [];
    renderForm();
  } catch (e) { toast(e.message, true); }
}

async function aiGlossBody() {
  if (!state.form.body.trim()) return toast("请先填写正文", true);
  if (!state.analyze) return toast("请先点「自动定级 + 提取生词」", true);
  state.aiLoading = true;
  renderForm();
  try {
    const r = await api("/articles/ai-glosses", "POST",
      { body: state.form.body, level: state.form.target_level });
    if (r.glosses) {
      const skipSet = new Set(state.form.skip || []);
      const g = {};
      Object.keys(r.glosses).forEach((k) => { if (!skipSet.has(k)) g[k] = r.glosses[k]; });
      state.form.glosses = g;
    }
    const mw = r.multiword_glosses || {};
    const lk = {};
    Object.keys(mw).forEach((k) => (lk[k.toLowerCase()] = mw[k]));
    state.form.multiword.forEach((m) => {
      const g = lk[(m.text || "").toLowerCase()];
      if (g) m.gloss = g;
    });
    toast("已生成本文语境义（仅 ruby 显示）");
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.aiLoading = false;
    renderForm();
  }
}

function validateQuizzes() {
  for (let i = 0; i < state.form.quizzes.length; i++) {
    const q = state.form.quizzes[i];
    if (!q.question.trim()) { toast(`第 ${i + 1} 题问题不能为空`, true); return false; }
    if (q.options.length < 2) { toast(`第 ${i + 1} 题至少 2 个选项`, true); return false; }
    if (!q.options.some((o) => o.correct)) { toast(`第 ${i + 1} 题至少一个正确选项`, true); return false; }
    for (const o of q.options) if (!o.text.trim()) { toast(`第 ${i + 1} 题存在空选项`, true); return false; }
  }
  return true;
}

async function saveArticle() {
  if (!state.form.title.trim()) return toast("标题不能为空", true);
  if (!state.form.body.trim()) return toast("正文不能为空", true);
  if (!state.form.topics.length) return toast("至少选择一个主题", true);
  if (!validateQuizzes()) return;
  const payload = { ...state.form,
    multiword: state.form.multiword.map((m) => ({ text: m.text, gloss: m.gloss, kind: m.kind })),
    quizzes: state.form.quizzes.map((q) => ({
      type: "choice", question: q.question, options: q.options,
      explanation_zh: q.explanation_zh, explanation_en: q.explanation_en })) };
  try {
    if (state.editing === "new") await api("/articles", "POST", payload);
    else await api("/articles/" + state.editing, "PUT", payload);
  } catch (e) { return toast(e.message, true); }
  state.editing = null;
  await renderArticles();
  toast("已保存");
}

// ---------- AI 提供者 ----------

function newProvider() { return { name: "", base_url: "", api_key: "", model: "" }; }

async function loadAi() {
  const [providers, def] = await Promise.all([
    api("/ai/providers"), api("/ai/default")]);
  state.ai.providers = providers.items;
  state.ai.default = def.default;
}
function startAddProvider() {
  state.ai.editing = "new";
  state.ai.form = newProvider();
  renderAi();
}
function startEditProvider(name) {
  const p = state.ai.providers.find((x) => x.name === name);
  state.ai.editing = name;
  state.ai.form = { ...p };
  renderAi();
}
function cancelAiEdit() { state.ai.editing = null; state.ai.form = null; renderAi(); }
function setAiField(k, v) { state.ai.form[k] = v; }

async function saveProvider() {
  const f = state.ai.form;
  if (!f.name.trim()) return toast("名称不能为空", true);
  if (!f.base_url.trim()) return toast("url 不能为空", true);
  if (!f.model.trim()) return toast("模型名不能为空", true);
  try {
    if (state.ai.editing === "new") {
      await api("/ai/providers", "POST", f);
    } else {
      const body = { base_url: f.base_url, api_key: f.api_key, model: f.model };
      if (f.name.trim() !== state.ai.editing) body.new_name = f.name.trim();
      await api("/ai/providers/" + encodeURIComponent(state.ai.editing), "PUT", body);
    }
  } catch (e) { return toast(e.message, true); }
  state.ai.editing = null; state.ai.form = null;
  await renderAi();
  toast("已保存");
}

async function delProvider(name) {
  if (!confirm(`确认删除提供者「${name}」？`)) return;
  try { await api("/ai/providers/" + encodeURIComponent(name), "DELETE"); }
  catch (e) { return toast(e.message, true); }
  await renderAi();
  toast("已删除");
}

async function setDefaultProvider(name) {
  try { await api("/ai/default", "PUT", { name }); }
  catch (e) { return toast(e.message, true); }
  await renderAi();
  toast(`默认提供者已设为 ${name}`);
}

// ---------- 渲染 ----------

async function switchTab(tab) {
  state.tab = tab;
  $("tab-topics").className = "tab" + (tab === "topics" ? " active" : "");
  $("tab-articles").className = "tab" + (tab === "articles" ? " active" : "");
  $("tab-ai").className = "tab" + (tab === "ai" ? " active" : "");
  if (tab === "topics") await renderTopics();
  else if (tab === "articles") await renderArticles();
  else await renderAi();
}

async function renderTopics() {
  await loadTopics();
  main().innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <input type="text" id="new-topic-key" placeholder="主题 key（小写字母，如 space）" style="max-width:260px">
        <input type="text" id="new-topic-label" placeholder="中文名（如 太空/宇宙）" style="max-width:220px">
        <button class="primary" onclick="addTopic()">添加主题</button>
      </div>
      <div>${state.topics.length ? "" : '<div class="empty">暂无主题</div>'}</div>
      ${state.topics.map((t) => `
        <div class="item">
          <div class="grow"><strong>${esc(t.label_zh)}</strong> <span class="muted">(${esc(t.key)})</span></div>
          <span class="muted">${t.article_count} 篇</span>
          <button class="danger small" onclick="delTopic('${esc(t.key)}','${esc(t.label_zh)}')">删除</button>
        </div>`).join("")}
    </div>`;
}

async function renderArticles() {
  await loadArticles();
  if (state.editing !== null) { renderForm(); return; }
  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>文章列表</strong>
        <button class="primary" onclick="startCreate()">+ 新增文章</button>
      </div>
    </div>
    <div class="card">
      ${state.articles.length ? "" : '<div class="empty">暂无文章</div>'}
      ${state.articles.map((a) => `
        <div class="item">
          <div class="grow">
            <div><strong>${esc(a.title)}</strong> ${a.subtitle ? `<span class="muted">— ${esc(a.subtitle)}</span>` : ""}</div>
            <div>${(a.topic_labels || a.topics).map((l) => `<span class="tag">${esc(l)}</span>`).join("")}
              <span class="muted">L${a.target_level ?? "?"} · ${a.word_count} 词</span></div>
          </div>
          <button class="small" onclick="startEdit('${esc(a.id)}')">编辑</button>
          <button class="danger small" onclick="delArticle('${esc(a.id)}','${esc(a.title)}')">删除</button>
        </div>`).join("")}
    </div>`;
}

function renderForm() {
  const f = state.form;
  const topicChecks = state.topics.map((t) => `
    <label><input type="checkbox" ${f.topics.includes(t.key) ? "checked" : ""}
      onchange="toggleTopic('${esc(t.key)}', this.checked)"> ${esc(t.label_zh)}</label>`).join("");

  const glossRows = state.analyze ? state.analyze.vocabulary.map((v) => `
    <div class="gloss-row">
      <div class="w" title="${esc(v.word)}">${esc(v.word)}${v.phonetic ? ` <span class="muted">${esc(v.phonetic)}</span>` : ""}</div>
      <input type="text" value="${esc(f.glosses[v.lemma] ?? "")}" oninput="setGloss('${esc(v.lemma)}', this.value)">
      <button class="danger small" onclick="delGloss('${esc(v.lemma)}')">删</button>
    </div>`).join("") : "";

  const mwRows = f.multiword.map((m, i) => `
    <div class="gloss-row">
      <div class="w" title="${esc(m.text)}">${esc(m.text)}${m.tag ? ` <span class="muted">${esc(m.tag)}</span>` : ""}</div>
      <select onchange="setMwKind(${i}, this.value)" style="width:90px;flex-shrink:0">
        <option value="term" ${m.kind === "phrase" ? "" : "selected"}>术语</option>
        <option value="phrase" ${m.kind === "phrase" ? "selected" : ""}>短语</option>
      </select>
      <input type="text" value="${esc(m.gloss ?? "")}" oninput="setMwGloss(${i}, this.value)" placeholder="中文注释">
      <button class="danger small" onclick="delMw(${i})">删</button>
    </div>`).join("");

  const quizzes = f.quizzes.map((q, qi) => `
    <div class="quiz">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <strong>第 ${qi + 1} 题</strong>
        <button class="danger small" onclick="delQuiz(${qi})">删除此题</button>
      </div>
      <div class="field"><label>问题</label>
        <input type="text" value="${esc(q.question)}" oninput="setQuiz(${qi},'question',this.value)"></div>
      <label>候选答案（勾选 = 正确项）</label>
      ${q.options.map((o, oi) => `
        <div class="opt">
          <input type="text" value="${esc(o.text)}" oninput="setOption(${qi},${oi},'text',this.value)" placeholder="选项 ${String.fromCharCode(65 + oi)}">
          <label class="correct"><input type="checkbox" ${o.correct ? "checked" : ""}
            onchange="setOption(${qi},${oi},'correct',this.checked)"> 正确</label>
          <button class="danger small" onclick="delOption(${qi},${oi})">删</button>
        </div>`).join("")}
      <button class="small" onclick="addOption(${qi})">+ 选项</button>
      <div class="field" style="margin-top:8px"><label>英文解释（可选）</label>
        <input type="text" value="${esc(q.explanation_en)}" oninput="setQuiz(${qi},'explanation_en',this.value)"></div>
      <div class="field"><label>中文解释（可选）</label>
        <input type="text" value="${esc(q.explanation_zh)}" oninput="setQuiz(${qi},'explanation_zh',this.value)"></div>
    </div>`).join("");

  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <strong>${state.editing === "new" ? "新增文章" : "编辑文章"}</strong>
        <button onclick="cancelEdit()">返回列表</button>
      </div>
      <div class="field"><label>标题</label>
        <input type="text" value="${esc(f.title)}" oninput="setField('title',this.value)"></div>
      <div class="field"><label>副标题（可选）</label>
        <input type="text" value="${esc(f.subtitle)}" oninput="setField('subtitle',this.value)"></div>
      <div class="field"><label>正文</label>
        <textarea oninput="setField('body',this.value)">${esc(f.body)}</textarea></div>
      <div class="field"><label>主题（可多选）</label>
        <div class="checkbox-list">${topicChecks || '<span class="muted">无主题，请先到「主题管理」添加</span>'}</div></div>
      <div class="row" style="margin-bottom:14px">
        <button class="primary" onclick="analyzeBody()">自动定级 + 提取生词</button>
        ${state.analyze ? `<span class="muted">已分析：${state.analyze.new_word_count} 个生词</span>` : ""}
        <button class="primary" onclick="aiGlossBody()" ${!state.analyze || state.aiLoading ? "disabled" : ""}>
          ${state.aiLoading ? "AI 生成中…" : "AI 生成本文义"}
        </button>
      </div>
      ${state.analyze ? `
        <div class="card" style="background:#fafbfe">
          <div class="stats">
            <div><div class="k">目标级数（可手改）</div><input type="number" value="${f.target_level ?? ""}"
              oninput="setField('target_level', this.value ? Number(this.value) : null)" style="width:130px"></div>
            <div><div class="k">字数</div><div class="v">${state.analyze.word_count}</div></div>
            <div><div class="k">生词率</div><div class="v">${(state.analyze.new_word_rate * 100).toFixed(1)}%</div></div>
          </div>
          ${glossRows ? `<label>生词中文注释（可手工改）</label>${glossRows}` : '<span class="muted">该级数下无生词</span>'}
        </div>` : ""}
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <strong>多词表达式（短语 / 术语）</strong>
      </div>
      <div class="muted" style="margin-bottom:10px">短语：并入全局短语库，计生词、进生词本；术语：仅本文行内注释，不计生词。</div>
      ${mwRows || '<div class="empty">暂无，点「自动定级」识别</div>'}
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <strong>课后小测</strong>
        <button class="small" onclick="addQuiz()">+ 添加题目</button>
      </div>
      ${quizzes || '<div class="empty">暂无题目</div>'}
    </div>

    <div class="row" style="gap:12px">
      <button class="primary" onclick="saveArticle()">保存</button>
      <button onclick="cancelEdit()">取消</button>
    </div>`;
}

async function renderAi() {
  await loadAi();
  if (state.ai.editing !== null) { renderAiForm(); return; }
  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>AI 提供者</strong>
        <button class="primary" onclick="startAddProvider()">+ 新增提供者</button>
      </div>
    </div>
    <div class="card">
      ${state.ai.providers.length ? "" : '<div class="empty">暂无提供者</div>'}
      ${state.ai.providers.map((p) => `
        <div class="item">
          <div class="grow">
            <div><strong>${esc(p.name)}</strong>
              ${p.name === state.ai.default ? '<span class="tag">默认</span>' : ""}
              <span class="muted">${esc(p.model)}</span></div>
            <div class="muted">${esc(p.base_url)} · ${
              p.api_key ? `<code>${esc(maskKey(p.api_key))}</code>` : "无 key"}</div>
          </div>
          ${p.name !== state.ai.default
            ? `<button class="small" onclick="setDefaultProvider('${esc(p.name)}')">设为默认</button>` : ""}
          <button class="small" onclick="startEditProvider('${esc(p.name)}')">编辑</button>
          <button class="danger small" onclick="delProvider('${esc(p.name)}')">删除</button>
        </div>`).join("")}
    </div>`;
}

function renderAiForm() {
  const f = state.ai.form;
  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <strong>${state.ai.editing === "new" ? "新增提供者" : "编辑提供者"}</strong>
        <button onclick="cancelAiEdit()">返回列表</button>
      </div>
      <div class="field"><label>名称</label>
        <input type="text" value="${esc(f.name)}" oninput="setAiField('name',this.value)" placeholder="如 DeepSeek"></div>
      <div class="field"><label>url（OpenAI 兼容端点，含 /v1）</label>
        <input type="text" value="${esc(f.base_url)}" oninput="setAiField('base_url',this.value)" placeholder="https://api.deepseek.com/v1"></div>
      <div class="field"><label>API key（可选）</label>
        <input type="password" value="${esc(f.api_key)}" oninput="setAiField('api_key',this.value)" placeholder="sk-..."></div>
      <div class="field"><label>模型名</label>
        <input type="text" value="${esc(f.model)}" oninput="setAiField('model',this.value)" placeholder="deepseek-chat"></div>
      <div class="row" style="gap:12px">
        <button class="primary" onclick="saveProvider()">保存</button>
        <button onclick="cancelAiEdit()">取消</button>
      </div>
    </div>`;
}

// ---------- 启动 ----------

(async function init() {
  try {
    await loadTopics();
    await renderTopics();
  } catch (e) {
    main().innerHTML = `<div class="card"><div class="empty">加载失败：${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
