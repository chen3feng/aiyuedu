<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读后台管理</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #fff; --line: #e6e9f2; --text: #1f2d50;
    --muted: #8a94ad; --accent: #4f7cff; --danger: #fa5151; --ok: #07c160;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 0 24px;
    display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 14px 0; font-weight: 700; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 14px 18px; cursor: pointer; color: var(--muted); font-weight: 600;
    border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { max-width: 1000px; margin: 24px auto; padding: 0 20px 80px; }
  .card { background: var(--card); border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 3px rgba(31,45,80,.06); margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], input[type=number], textarea, select {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit;
    color: var(--text); width: 100%; }
  textarea { resize: vertical; min-height: 120px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { font-size: 13px; color: var(--muted); }
  button { border: 1px solid var(--line); background: #fff; color: var(--text);
    border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); border-color: #f3c1c1; }
  button.small { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .muted { color: var(--muted); }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .grow { flex: 1; min-width: 0; }
  .tag { display: inline-block; font-size: 12px; color: var(--accent); background: #eef2fb;
    padding: 2px 8px; border-radius: 6px; margin-right: 4px; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; margin-bottom: 4px; }
  .checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkbox-list label { display: flex; align-items: center; gap: 4px; color: var(--text);
    border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .quiz { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .opt { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt input[type=text] { flex: 1; }
  .opt .correct { flex-shrink: 0; }
  .gloss-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .gloss-row .w { width: 180px; flex-shrink: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .gloss-row input { flex: 1; }
  .stats { display: flex; gap: 20px; margin-bottom: 10px; }
  .stats .k { color: var(--muted); font-size: 12px; }
  .stats .v { font-size: 16px; font-weight: 700; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f2d50; color: #fff; padding: 10px 20px; border-radius: 8px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,28,50,.45);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 24px; width: 100%;
    max-width: 520px; box-shadow: 0 12px 40px rgba(20,28,50,.2);
    max-height: calc(100vh - 40px); display: flex; flex-direction: column; }
  .modal h2 { margin: 0 0 16px; font-size: 16px; flex-shrink: 0; }
  .modal-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 18px; flex-shrink: 0; background: #fff; padding-top: 8px; }
  .status-pending, .status-analyzing { display: inline-block; padding: 2px 8px;
    border-radius: 6px; font-size: 12px; background: #fef3c7; color: #92400e; }
  .status-done { display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 12px; background: #d1fae5; color: #065f46; }
  .status-error { display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 12px; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<header>
  <h1>阅读后台管理</h1>
  <nav class="tabs">
    <div class="tab active" id="tab-articles" onclick="switchTab('articles')">文章管理</div>
    <div class="tab" id="tab-collections" onclick="switchTab('collections')">作品集</div>
    <div class="tab" id="tab-topics" onclick="switchTab('topics')">主题管理</div>
    <div class="tab" id="tab-ai" onclick="switchTab('ai')">AI 提供者</div>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="gen-overlay" onclick="if(event.target===this)closeGenerate()">
  <div class="modal">
    <h2>AI 生成正文</h2>
    <div class="modal-body">
      <div class="field"><label>文章大纲</label>
        <textarea id="gen-outline" placeholder="例如：一只小狐狸在森林里学会分享的故事"></textarea></div>
      <div class="field"><label>额外要求（可选）</label>
        <textarea id="gen-extra" placeholder="例如：包含对话、结尾有悬念"></textarea></div>
      <div class="field"><label>期望词汇量级别（可选，如 2000）</label>
        <input type="number" id="gen-level" placeholder="留空按 2000~4000 自动"></div>
      <div id="gen-result"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const main = () => $("main");

const state = {
  tab: "articles",
  topics: [],
  articles: [],
  collections: [],      // 作品集列表
  collectionDetail: null, // 正在查看的作品集详情
  editingChapter: null, // 正在编辑的章节 {collId, index}；null=不在编辑
  editing: null,        // null=列表, 'new'=新增, id=编辑
  form: null,           // 正在编辑的文章对象
  analyze: null,        // 定级/生词预览结果
  genLoading: false,    // AI 生成/修改正文进行中
  genBody: "",          // 已生成正文（预览用，确认后才写入 form）
  genTitleZh: "",       // AI 建议的中文标题
  genTitleEn: "",       // AI 建议的英文标题
  genTopics: [],        // AI 建议的主题 key 数组
  genReason: null,      // AI 失败原因（成功为 null）
  glossAiLoading: false, // AI 校正生词注释进行中
  glossSort: "appearance", // 生词注释列表排序：appearance=文中顺序，alpha=字母顺序
  mwSort: "appearance",    // 多词表达式列表排序
  ai: { providers: [], default: null, editing: null },
};

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;")
    .replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function maskKey(k) {
  if (!k) return "";
  if (k.length <= 8) return "****";
  return k.slice(0, 4) + "****" + k.slice(-4);
}

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.className = "toast"), 2600);
}

async function api(path, method, body) {
  const res = await fetch("/api" + path, {
    method: method || "GET",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

// ---------- 主题 ----------

async function loadTopics() {
  state.topics = (await api("/topics")).items;
}
async function addTopic() {
  const key = $("new-topic-key").value.trim();
  const label = $("new-topic-label").value.trim();
  if (!key || !label) return toast("key 与中文名均不能为空", true);
  try { await api("/topics", "POST", { key, label_zh: label }); } catch (e) { return toast(e.message, true); }
  $("new-topic-key").value = ""; $("new-topic-label").value = "";
  await renderTopics();
  toast("已添加主题");
}
async function delTopic(key, label) {
  if (!confirm(`确认删除主题「${label}」？`)) return;
  try { await api("/topics/" + key, "DELETE"); } catch (e) { return toast(e.message, true); }
  await renderTopics();
  toast("已删除主题");
}

// ---------- 文章 ----------

function newForm() {
  return { title: "", title_zh: "", subtitle: "", body: "", topics: [], target_level: null,
    glosses: {}, full_glosses: {}, headwords: {}, multiword: [], skip: [], quizzes: [] };
}
function newOption() { return { text: "", correct: false }; }
function newQuiz() {
  return { type: "choice", question: "", options: [newOption(), newOption(), newOption(), newOption()],
    explanation_zh: "", explanation_en: "" };
}

async function loadArticles() {
  state.articles = (await api("/articles")).items;
}
async function startCreate() {
  state.editing = "new";
  state.form = newForm();
  state.analyze = null;
  renderArticles();
}
async function startEdit(id) {
  const a = await api("/articles/" + id);
  state.editing = id;
  state.form = { title: a.title, title_zh: a.title_zh || "", subtitle: a.subtitle || "", body: a.body, topics: a.topics || [],
    target_level: a.target_level, glosses: a.glosses || {}, full_glosses: a.full_glosses || {},
    headwords: a.headwords || {},
    multiword: Object.entries(a.terms || {}).map(([text, gloss]) => ({ text, gloss, kind: "term" })),
    skip: a.skip || [],
    quizzes: a.quizzes || [] };
  // 后端已附带按已存 glosses 重建的生词表，打开即回显「生词中文注释」，无需再点「自动定级」
  state.analyze = a.vocabulary !== undefined ? {
    vocabulary: a.vocabulary || [],
    word_count: a.word_count ?? 0,
    new_word_count: a.new_word_count ?? 0,
    new_word_rate: a.new_word_rate ?? 0,
  } : null;
  renderArticles();
}
async function delArticle(id, title) {
  if (!confirm(`确认删除文章「${title}」？`)) return;
  try { await api("/articles/" + id, "DELETE"); } catch (e) { return toast(e.message, true); }
  await renderArticles();
  toast("已删除文章");
}
function cancelEdit() { state.editing = null; renderArticles(); }

// 表单字段
function setField(k, v) { state.form[k] = v; }
function toggleTopic(key, checked) {
  const t = state.form.topics;
  const i = t.indexOf(key);
  if (checked && i < 0) t.push(key);
  if (!checked && i >= 0) t.splice(i, 1);
}
function addQuiz() { state.form.quizzes.push(newQuiz()); renderForm(); }
function delQuiz(qi) { state.form.quizzes.splice(qi, 1); renderForm(); }
function setQuiz(qi, k, v) { state.form.quizzes[qi][k] = v; }
function addOption(qi) { state.form.quizzes[qi].options.push(newOption()); renderForm(); }
function delOption(qi, oi) { state.form.quizzes[qi].options.splice(oi, 1); renderForm(); }
function setOption(qi, oi, k, v) { state.form.quizzes[qi].options[oi][k] = v; }
function setGloss(lemma, v) { state.form.glosses[lemma] = v; }
function setMwGloss(i, v) { state.form.multiword[i].gloss = v; }
function setMwKind(i, kind) { state.form.multiword[i].kind = kind; renderForm(); }
function delMw(i) { state.form.multiword.splice(i, 1); renderForm(); }
function delGloss(lemma) {
  delete state.form.glosses[lemma];
  if (!state.form.skip.includes(lemma)) state.form.skip.push(lemma);
  if (state.analyze) state.analyze.vocabulary = state.analyze.vocabulary.filter((v) => v.lemma !== lemma);
  renderForm();
}
function toggleGlossSort() {
  state.glossSort = state.glossSort === "alpha" ? "appearance" : "alpha";
  renderForm();
}
function toggleMwSort() {
  state.mwSort = state.mwSort === "alpha" ? "appearance" : "alpha";
  renderForm();
}

async function analyzeBody() {
  const body = state.form.body;
  if (!body.trim()) return toast("请先填写正文", true);
  try {
    const r = await api("/articles/analyze", "POST", { body });
    state.analyze = r;
    state.form.target_level = r.level;
    const skipSet = new Set(state.form.skip || []);
    const g = {};
    r.vocabulary.forEach((v) => { if (!skipSet.has(v.lemma)) g[v.lemma] = v.gloss; });
    state.form.glosses = g;
    state.analyze.vocabulary = r.vocabulary.filter((v) => !skipSet.has(v.lemma));
    state.form.multiword = r.multiword || [];
    renderForm();
  } catch (e) { toast(e.message, true); }
}

async function aiGlossBody() {
  if (!state.form.body.trim()) return toast("请先填写正文", true);
  if (!state.analyze) return toast("请先点「自动定级 + 提取生词」", true);
  state.glossAiLoading = true;
  renderForm();
  try {
    const r = await api("/articles/ai-glosses", "POST",
      {
        body: state.form.body,
        level: state.form.target_level,
        existing_glosses: state.form.glosses || {},
      });
    if (r.glosses) {
      // 合并：后端已按 "AI > 用户现有 > 词典兜底" 合成，但仍要尊重 skip（已删的词条不再带回）
      const skipSet = new Set(state.form.skip || []);
      const g = {};
      Object.keys(r.glosses).forEach((k) => {
        if (!skipSet.has(k) && r.glosses[k]) g[k] = r.glosses[k];
      });
      state.form.glosses = g;
    }
    const mw = r.multiword_glosses || {};
    const lk = {};
    Object.keys(mw).forEach((k) => (lk[k.toLowerCase()] = mw[k]));
    state.form.multiword.forEach((m) => {
      const g = lk[(m.text || "").toLowerCase()];
      if (g) m.gloss = g;
    });
    toast(r.reason
      ? r.reason
      : "已用 AI 校正本文语境义（仅 ruby 显示）", !!r.reason);
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.glossAiLoading = false;
    renderForm();
  }
}

function openGenerate() {
  state.genBody = "";
  state.genTitleZh = "";
  state.genTitleEn = "";
  state.genTopics = [];
  state.genReason = null;
  $("gen-outline").value = "";
  $("gen-extra").value = "";
  $("gen-level").value = state.form.target_level ?? "";
  $("gen-overlay").classList.add("show");
  renderGenResult();
}
function closeGenerate() {
  if (state.genLoading) return;
  $("gen-overlay").classList.remove("show");
}
function renderGenResult() {
  const r = $("gen-result");
  if (state.genLoading) {
    r.innerHTML = `<div class="field"><div class="muted">AI 生成中（标题 + 主题 + 正文），请稍候…</div></div>`;
    return;
  }
  if (state.genReason && !state.genBody) {
    // AI 整体失败
    r.innerHTML = `
      <div class="field"><div class="muted" style="color:#fa5151">${esc(state.genReason)}</div></div>
      <div class="actions">
        <button onclick="closeGenerate()">取消</button>
        <button class="primary" onclick="doGenerate()">重试</button>
      </div>`;
    return;
  }
  if (!state.genBody) {
    r.innerHTML = `
      <div class="actions">
        <button onclick="closeGenerate()">取消</button>
        <button class="primary" onclick="doGenerate()">生成</button>
      </div>`;
    return;
  }
  // 生成成功：显示可编辑的标题 / 主题 / 正文预览
  const topicChecks = state.topics.map((t) => {
    const checked = state.genTopics.includes(t.key) ? "checked" : "";
    return `<label><input type="checkbox" ${checked}
      onchange="toggleGenTopic('${esc(t.key)}', this.checked)"> ${esc(t.label_zh)}</label>`;
  }).join("");
  r.innerHTML = `
    <div class="field"><label>中文标题（可改）</label>
      <input type="text" id="gen-title-zh" value="${esc(state.genTitleZh)}"
        oninput="state.genTitleZh=this.value"></div>
    <div class="field"><label>英文标题（可改）</label>
      <input type="text" id="gen-title-en" value="${esc(state.genTitleEn)}"
        oninput="state.genTitleEn=this.value"></div>
    <div class="field"><label>主题（可多选）</label>
      <div class="checkbox-list">${topicChecks || '<span class="muted">无主题，请先到「主题管理」添加</span>'}</div></div>
    <div class="field"><label>生成正文预览（可改）</label>
      <textarea id="gen-body-edit" style="min-height:160px;background:#fafbfe"
        oninput="state.genBody=this.value">${esc(state.genBody)}</textarea></div>
    <div class="field"><label>修改建议（可选）</label>
      <textarea id="gen-suggestions" placeholder="例如：把主角改成一只猫、结尾更温暖"></textarea></div>
    <div class="row" style="gap:8px;margin-bottom:14px">
      <button onclick="doGenerate()">重新生成</button>
      <button class="primary" onclick="doRevise()">根据建议修改正文</button>
    </div>
    <div class="actions">
      <button onclick="closeGenerate()">取消</button>
      <button class="primary" onclick="applyGenerated()">应用到表单</button>
    </div>`;
}
function toggleGenTopic(key, checked) {
  if (checked && !state.genTopics.includes(key)) state.genTopics.push(key);
  else if (!checked) state.genTopics = state.genTopics.filter((k) => k !== key);
}
async function doGenerate() {
  const outline = $("gen-outline").value.trim();
  if (!outline) return toast("请填写文章大纲", true);
  const extra = $("gen-extra").value.trim();
  const lv = $("gen-level").value.trim();
  const target_level = lv ? Number(lv) : null;
  state.genLoading = true;
  renderGenResult();
  try {
    const r = await api("/articles/generate", "POST",
      { outline, extra_requirements: extra, target_level });
    state.genBody = r.body || "";
    state.genTitleZh = r.title_zh || "";
    state.genTitleEn = r.title_en || "";
    state.genTopics = Array.isArray(r.topics) ? r.topics : [];
    state.genReason = r.reason || null;
    if (r.reason) toast(r.reason, true);
  } catch (e) {
    state.genReason = e.message;
    toast(e.message, true);
  } finally {
    state.genLoading = false;
    renderGenResult();
  }
}
async function doRevise() {
  const suggestions = $("gen-suggestions").value.trim();
  if (!suggestions) return toast("请填写修改建议", true);
  state.genLoading = true;
  renderGenResult();
  try {
    const r = await api("/articles/revise", "POST",
      { body: state.genBody, suggestions });
    state.genBody = r.body;
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.genLoading = false;
    renderGenResult();
  }
}
function applyGenerated() {
  // 应用到表单：英文标题 / 中文标题 / 主题 / 正文 / 词汇量
  state.form.title = state.genTitleEn || state.form.title || "";
  state.form.title_zh = state.genTitleZh || state.form.title_zh || "";
  state.form.body = state.genBody;
  state.form.topics = [...state.genTopics];
  const lv = $("gen-level").value.trim();
  if (lv) state.form.target_level = Number(lv);
  $("gen-overlay").classList.remove("show");
  renderForm();
  toast("标题 / 主题 / 正文已应用，请检查后保存");
}

function validateQuizzes() {
  for (let i = 0; i < state.form.quizzes.length; i++) {
    const q = state.form.quizzes[i];
    if (!q.question.trim()) { toast(`第 ${i + 1} 题问题不能为空`, true); return false; }
    if (q.options.length < 2) { toast(`第 ${i + 1} 题至少 2 个选项`, true); return false; }
    if (!q.options.some((o) => o.correct)) { toast(`第 ${i + 1} 题至少一个正确选项`, true); return false; }
    for (const o of q.options) if (!o.text.trim()) { toast(`第 ${i + 1} 题存在空选项`, true); return false; }
  }
  return true;
}

async function saveArticle() {
  if (!state.form.title.trim()) return toast("标题不能为空", true);
  if (!state.form.body.trim()) return toast("正文不能为空", true);
  if (!state.form.topics.length) return toast("至少选择一个主题", true);
  if (!validateQuizzes()) return;
  const payload = { ...state.form,
    multiword: state.form.multiword.map((m) => ({ text: m.text, gloss: m.gloss, kind: m.kind })),
    quizzes: state.form.quizzes.map((q) => ({
      type: "choice", question: q.question, options: q.options,
      explanation_zh: q.explanation_zh, explanation_en: q.explanation_en })) };
  try {
    if (state.editing === "new") await api("/articles", "POST", payload);
    else await api("/articles/" + state.editing, "PUT", payload);
  } catch (e) { return toast(e.message, true); }
  state.editing = null;
  await renderArticles();
  toast("已保存");
}

// ---------- AI 提供者 ----------

function newProvider() { return { name: "", base_url: "", api_key: "", model: "" }; }

async function loadAi() {
  const [providers, def] = await Promise.all([
    api("/ai/providers"), api("/ai/default")]);
  state.ai.providers = providers.items;

async function saveProvider() {
  const f = state.ai.form;
  if (!f.name.trim()) return toast("名称不能为空", true);
  if (!f.base_url.trim()) return toast("url 不能为空", true);
  if (!f.model.trim()) return toast("模型名不能为空", true);
  try {
    if (state.ai.editing === "new") {
      await api("/ai/providers", "POST", f);
    } else {
      const body = { base_url: f.base_url, api_key: f.api_key, model: f.model };
      if (f.name.trim() !== state.ai.editing) body.new_name = f.name.trim();
      await api("/ai/providers/" + encodeURIComponent(state.ai.editing), "PUT", body);

  await renderAi();

    ec.body = ch.body || "";

    <div class="item" style="display:block">

        <div class="field grow"><label>中文标题</label>
          <input type="text" value="${esc(ec.title_zh)}" oninput="ecField('title_zh', this.value)"></div>
        <div class="field" style="max-width:140px"><label>目标词汇量</label>
          <input type="number" value="${ec.level}" oninput="ecField('level', parseInt(this.value,10) || 3000)"></div>
      </div>
      <div class="field"><label>正文（可修古腾堡残留的断行 / 注记；斜体用 &lt;em&gt;…&lt;/em&gt;）</label>
        <textarea oninput="ecField('body', this.value)" style="min-height:260px;font-family:monospace;font-size:13px">${esc(ec.body)}</textarea></div>
      <div class="muted" style="margin-bottom:10px">正文变更后该章 AI 状态会重置为「待分析」（词条保留，可重跑 AI 刷新）。</div>

function setChGloss(i, v) {
  const entries = Object.entries(state.editingChapter.glosses);
  entries[i][1] = v;
  state.editingChapter.glosses = Object.fromEntries(entries);
}
function delChGloss(i) {
  const entries = Object.entries(state.editingChapter.glosses);
  entries.splice(i, 1);
  state.editingChapter.glosses = Object.fromEntries(entries);
  renderCollectionDetail();
}
function addChGloss() {
  const k = $("ch-add-word").value.trim();
  const v = $("ch-add-gloss").value.trim();
  if (!k) return toast("请填写单词", true);
  state.editingChapter.glosses[k] = v;
  renderCollectionDetail();
}
function setChTerm(i, v) {
  const entries = Object.entries(state.editingChapter.terms);
  entries[i][1] = v;
  state.editingChapter.terms = Object.fromEntries(entries);
}
function delChTerm(i) {
  const entries = Object.entries(state.editingChapter.terms);
  entries.splice(i, 1);
  state.editingChapter.terms = Object.fromEntries(entries);
  renderCollectionDetail();
}
function addChTerm() {
  const k = $("ch-add-term").value.trim();
  const v = $("ch-add-term-gloss").value.trim();
  if (!k) return toast("请填写短语原文", true);
  state.editingChapter.terms[k] = v;
  renderCollectionDetail();
}

async function aiCalibrateChapter() {
  const ec = state.editingChapter;
  if (!ec) return;
  ec.calibrating = true;
  renderCollectionDetail();
  try {
    const r = await api(
      `/collections/${ec.collId}/chapters/${ec.index}/gloss-ai`, "POST",
      {
        body: ec.body,          // 校准用编辑器当前正文（可能未保存）
        target_level: ec.level,
        glosses: ec.glosses,
        terms: ec.terms,
      });
    ec.glosses = r.glosses || {};
    ec.terms = r.terms || {};
    ec.calibrating = false;
    toast(r.reason || `AI 校准完成：词汇 ${Object.keys(ec.glosses).length} 条，短语 ${Object.keys(ec.terms).length} 条`, !!r.reason);
    renderCollectionDetail();
  } catch (e) {
    ec.calibrating = false;
    toast(e.message, true);
    renderCollectionDetail();
  }
}

async function saveChapterEdit(collId, idx) {
  const ec = state.editingChapter;
  const payload = {
    title: ec.title,
    title_zh: ec.title_zh,
    body: ec.body,
    target_level: ec.level,
    glosses: ec.glosses,
    terms: ec.terms,
  };
  try {
    const ch = await api(`/collections/${collId}/chapters/${idx}`, "PUT", payload);
    state.editingChapter = null;
    toast(`第 ${idx} 章已保存${ch.ai_status === "pending" ? "（正文已变更，建议重跑 AI）" : ""}`);
    await openCollectionDetail(collId);
  } catch (e) { toast(e.message, true); }
}

  return ({pending: "待分析", analyzing: "分析中…", done: "完成", error: "失败"})[s] || "未知";

      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <strong>第 ${qi + 1} 题</strong>
        <button class="danger small" onclick="delQuiz(${qi})">删除此题</button>
      </div>
      <div class="field"><label>问题</label>
        <input type="text" value="${esc(q.question)}" oninput="setQuiz(${qi},'question',this.value)"></div>
      <label>候选答案（勾选 = 正确项）</label>
      ${q.options.map((o, oi) => `
        <div class="opt">
          <input type="text" value="${esc(o.text)}" oninput="setOption(${qi},${oi},'text',this.value)" placeholder="选项 ${String.fromCharCode(65 + oi)}">
          <label class="correct"><input type="checkbox" ${o.correct ? "checked" : ""}
            onchange="setOption(${qi},${oi},'correct',this.checked)"> 正确</label>
          <button class="danger small" onclick="delOption(${qi},${oi})">删</button>
        </div>`).join("")}
      <button class="small" onclick="addOption(${qi})">+ 选项</button>
      <div class="field" style="margin-top:8px"><label>英文解释（可选）</label>
        <input type="text" value="${esc(q.explanation_en)}" oninput="setQuiz(${qi},'explanation_en',this.value)"></div>
      <div class="field"><label>中文解释（可选）</label>
        <input type="text" value="${esc(q.explanation_zh)}" oninput="setQuiz(${qi},'explanation_zh',this.value)"></div>
    </div>`).join("");

  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <strong>${state.editing === "new" ? "新增文章" : "编辑文章"}</strong>
        <button onclick="cancelEdit()">返回列表</button>
      </div>
      ${state.editing === "new" ? `
      <div class="row" style="margin-bottom:14px">
        <button class="primary" style="width:100%" onclick="openGenerate()">AI 一键生成</button>
      </div>` : ""}
      <div class="field"><label>标题</label>
        <input type="text" value="${esc(f.title)}" oninput="setField('title',this.value)"></div>
      <div class="field"><label>中文标题（可选）</label>
        <input type="text" value="${esc(f.title_zh ?? "")}" oninput="setField('title_zh',this.value)"
          ${state.editing === "new" ? 'placeholder="例如：秋日田野"' : ""}></div>
      <div class="field"><label>副标题（可选）</label>
        <input type="text" value="${esc(f.subtitle)}" oninput="setField('subtitle',this.value)"></div>
      <div class="field"><label>正文</label>
        <textarea oninput="setField('body',this.value)">${esc(f.body)}</textarea></div>
      <div class="field"><label>主题（可多选）</label>
        <div class="checkbox-list">${topicChecks || '<span class="muted">无主题，请先到「主题管理」添加</span>'}</div></div>
      <div class="row" style="margin-bottom:14px">
        <button class="primary" onclick="analyzeBody()">自动定级 + 提取生词</button>
        ${state.analyze ? `<span class="muted">已分析：${state.analyze.new_word_count} 个生词</span>` : ""}
        <button class="primary" onclick="aiGlossBody()" ${!state.analyze || state.glossAiLoading ? "disabled" : ""}>
          ${state.glossAiLoading ? "AI 校正中…" : "AI校正"}
        </button>
      </div>
      ${state.analyze ? `
        <div class="card" style="background:#fafbfe">
          <div class="stats">
            <div><div class="k">目标级数（可手改）</div><input type="number" value="${f.target_level ?? ""}"
              oninput="setField('target_level', this.value ? Number(this.value) : null)" style="width:130px"></div>
            <div><div class="k">字数</div><div class="v">${state.analyze.word_count}</div></div>
            <div><div class="k">生词率</div><div class="v">${(state.analyze.new_word_rate * 100).toFixed(1)}%</div></div>
          </div>
          ${glossRows ? `
            <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">
              <label style="margin:0">生词中文注释（可手工改）</label>
              <button class="small" onclick="toggleGlossSort()">${state.glossSort === "alpha" ? "按文中顺序" : "按字母顺序"}</button>
            </div>
            ${glossRows}` : '<span class="muted">该级数下无生词</span>'}
        </div>` : ""}
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <strong>多词表达式（短语 / 术语）</strong>
        <button class="small" onclick="toggleMwSort()">${state.mwSort === "alpha" ? "按文中顺序" : "按字母顺序"}</button>
      </div>
      <div class="muted" style="margin-bottom:10px">短语：并入全局短语库，计生词、进生词本；术语：仅本文行内注释，不计生词。</div>
      ${mwRows || '<div class="empty">暂无，点「自动定级」识别</div>'}
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <strong>课后小测</strong>
        <button class="small" onclick="addQuiz()">+ 添加题目</button>
      </div>
      ${quizzes || '<div class="empty">暂无题目</div>'}
    </div>

    <div class="row" style="gap:12px">
      <button class="primary" onclick="saveArticle()">保存</button>
      <button onclick="cancelEdit()">取消</button>
    </div>`;
}

async function renderAi() {
  await loadAi();
  if (state.ai.editing !== null) { renderAiForm(); return; }
  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <strong>AI 提供者</strong>
        <button class="primary" onclick="startAddProvider()">+ 新增提供者</button>
      </div>
    </div>
    <div class="card">
      ${state.ai.providers.length ? "" : '<div class="empty">暂无提供者</div>'}
      ${state.ai.providers.map((p) => `
        <div class="item">
          <div class="grow">
            <div><strong>${esc(p.name)}</strong>
              ${p.name === state.ai.default ? '<span class="tag">默认</span>' : ""}
              <span class="muted">${esc(p.model)}</span></div>
            <div class="muted">${esc(p.base_url)} · ${
              p.api_key ? `<code>${esc(maskKey(p.api_key))}</code>` : "无 key"}</div>
          </div>
          ${p.name !== state.ai.default
            ? `<button class="small" onclick="setDefaultProvider('${esc(p.name)}')">设为默认</button>`
            : ""}
          <button class="small" onclick="testProvider('${esc(p.name)}')">测试连接</button>
          <button class="small" onclick="startEditProvider('${esc(p.name)}')">编辑</button>
          <button class="danger small" onclick="delProvider('${esc(p.name)}')">删除</button>
        </div>`).join("")}
    </div>
    <div class="card" id="ai-test-result" style="display:none">
      <strong>测试结果</strong>
      <div id="ai-test-body" class="muted" style="margin-top:8px;white-space:pre-wrap"></div>
    </div>`;
}

async function testProvider(name) {
  const box = $("ai-test-result");
  const body = $("ai-test-body");
  box.style.display = "block";
  body.textContent = `测试 ${name} 中…`;
  try {
    const r = await api("/ai/test", "POST", { name });
    if (r.ok) {
      body.textContent = `✓ ${name} 成功\nAI 返回: ${r.content}`;
    } else {
      body.textContent = `✗ ${name} 失败\n${r.error}`;
      toast(r.error, true);
    }
  } catch (e) {
    body.textContent = `✗ ${name} 请求失败\n${e.message}`;
    toast(e.message, true);
  }
}

function renderAiForm() {
  const f = state.ai.form;
  main().innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <strong>${state.ai.editing === "new" ? "新增提供者" : "编辑提供者"}</strong>
        <button onclick="cancelAiEdit()">返回列表</button>
      </div>
      <div class="field"><label>名称</label>
        <input type="text" value="${esc(f.name)}" oninput="setAiField('name',this.value)" placeholder="如 DeepSeek"></div>
      <div class="field"><label>url（OpenAI 兼容端点，含 /v1）</label>
        <input type="text" value="${esc(f.base_url)}" oninput="setAiField('base_url',this.value)" placeholder="https://api.deepseek.com/v1"></div>
      <div class="field"><label>API key（可选）</label>
        <input type="password" value="${esc(f.api_key)}" oninput="setAiField('api_key',this.value)" placeholder="sk-..."></div>
      <div class="field"><label>模型名</label>
        <input type="text" value="${esc(f.model)}" oninput="setAiField('model',this.value)" placeholder="deepseek-chat"></div>
      <div class="row" style="gap:12px">
        <button class="primary" onclick="saveProvider()">保存</button>
        <button onclick="cancelAiEdit()">取消</button>
      </div>
    </div>`;
}

// ---------- 启动 ----------

(async function init() {
  try {
    await loadArticles();
    await renderArticles();
  } catch (e) {
    main().innerHTML = `<div class="card"><div class="empty">加载失败：${esc(e.message)}</div></div>`;
  }
})();
</script>
</body>
</html>
